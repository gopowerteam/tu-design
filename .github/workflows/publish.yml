name: Publish

# 推送 v<version> 格式的 tag 时自动发布 @tu-design/* 包到 npm（锁定版本模型）。
# tag 由本地 bumpp -r 创建（pnpm release）。
#
# ⚠️ 新增可发布包时，必须同步更新 PACKAGES 清单，否则该包永不发布。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # changelogithub 创建 GitHub Release
  id-token: write # npm OIDC Trusted Publishing（无需 NPM_TOKEN）

env:
  # 显式发布清单 = 版本校验 / 打包的唯一事实源（@tu-design/docs 为私有文档站，禁止加入）
  PACKAGES: "@tu-design/vue @tu-design/cli"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # changelogithub 生成 Release notes 需要完整 git 历史
        with:
          fetch-depth: 0

      # pnpm 必须先于 setup-node 安装（setup-node@v5 的 Environment details
      # 会探测 packageManager 字段，pnpm 缺失时硬失败；与 ci.yml 顺序对齐）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 校验锁定版本（所有发布包 = tag 版本）
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for pkg in $PACKAGES; do
            dir="${pkg#@tu-design/}"
            actual="$(node -p "require('./packages/$dir/package.json').version")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$pkg 版本 $actual 与 tag v$expected 不一致（锁定版本模型要求全部一致）"
              exit 1
            fi
          done
          echo "锁定版本校验通过：v$expected"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 逐包构建打包（prepack 触发完整构建）
        run: |
          for pkg in $PACKAGES; do
            pnpm --filter "$pkg" pack --pack-destination "$RUNNER_TEMP/dist"
          done

      - name: 逐包发布到 npm（OIDC，幂等：重跑时跳过已发布版本）
        run: |
          npm install -g npm@latest
          cd "$RUNNER_TEMP/dist"
          for f in ./*.tgz; do
            if out="$(npm publish "$f" 2>&1)"; then
              echo "发布成功: $f"
            elif echo "$out" | grep -q "Cannot publish over"; then
              # 403 已发布 / 409 进入 staged 审核（npm 新包安全管线）
              echo "已发布或待 npm 审批（staged），跳过: $f"
              echo "$out"
            else
              echo "$out" >&2
              exit 1
            fi
          done
          echo "提示：被跳过的版本若处于 staged，需在 npmjs.com 的 Staged Packages 审批后才会上线"

      - name: 生成 GitHub Release
        # 用 pnpm dlx 而非 npx：npx 在仓库内会触发 devEngines.packageManager 硬失败
        run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
