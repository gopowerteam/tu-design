packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5.9
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vue: ^3.5.43
  "@ark-ui/vue": ^5.39.2
  tailwindcss: ^4
  "@tailwindcss/vite": ^4
  unplugin-vue-components: ^32.1.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@vue/test-utils": ^2.5.1
  "@types/prompts": ^2.4.8
  vitest: ^5.0.1
  happy-dom: ^20
  shiki: ^4.4.3
  vitepress: "2.0.0-alpha.20"
  yaml: ^2.4.0
  tsx: ^4.0.0
  commander: ^15
  prompts: ^2
  picocolors: ^1
  package-manager-detector: ^1
  "@changesets/cli": ^3.0.3
  vue-tsc: ^3.3.11
  "@vitejs/plugin-vue": ^6
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: set this to true or false
