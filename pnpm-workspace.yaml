packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# 显式关闭供应链时效策略（与本地环境一致）：pnpm 12 默认 24h 内新发布的包拒装，
# 会导致 CI --frozen-lockfile 与本地 install 策略错位（jose@6.2.15 事故）。
minimumReleaseAge: 0

catalog:
  "@types/node": ^26.6.6
  dev: ^0.1.5
  rm: ^0.1.8
  run: ^2.1.13
  typescript: ^6.0.3 # TS7 native 暂无法被 vue-tsc 解析（language-tools#6167），停在 6.x JS 线
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vue: ^3.5.45
  "@ark-ui/vue": ^5.40.0
  "@zag-js/popper": ^1.48.0
  "@tanstack/vue-form": ^1.33.5
  "@tanstack/vue-table": ^9.3.1
  "@tanstack/vue-virtual": ^3.13.52
  valibot: ^1.5.0
  tailwindcss: ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  unplugin-vue-components: ^32.1.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@vue/test-utils": ^2.6.0
  "@types/prompts": ^2.4.9
  vitest: ^5.1.1
  happy-dom: ^21.0.4
  shiki: ^4.6.0
  vitepress: "2.0.0-alpha.20"
  yaml: ^2.9.1
  tsx: ^4.23.15
  commander: ^15.1.0
  prompts: ^2.4.2
  picocolors: ^1.1.1
  "@modelcontextprotocol/sdk": ^1.32.2
  zod: ^4.6.7
  bumpp: ^12.3.0
  vue-tsc: ^3.3.14
  "@vitejs/plugin-vue": ^6.0.11
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # vite-plus 1.7 捆绑 vitest/@vitest 浏览器套件 5.1.0 传递实例；
    # vitest 主包 5.1.1 对其 optional peer 的同版本要求无法满足（本仓库不用 browser/UI 模式）
    "@vitest/ui": "*"
    "@vitest/browser-preview": "*"
allowBuilds:
  esbuild: true
  inotify: set this to true or false
  # vue-demi 的 postinstall 做 Vue 版本切换；本仓库锁定 Vue 3.5，批准执行
  vue-demi: true
